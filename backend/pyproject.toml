[project]
name = "emi-coach-backend"
version = "0.1.0"
description = "Minimal metadata API. Not a financial ledger."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.142.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
