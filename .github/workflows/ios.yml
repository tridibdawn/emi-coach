name: ios
on:
  workflow_dispatch:
  # macOS GitHub-hosted runners are required. This workflow is not part of the
  # default PR gate until a macOS runner is available on the repository.
  # Local command (macOS):
  #   cd apps/mobile && bundle install && bundle exec pod install --project-directory=ios
  #   yarn react-native build-ios --mode Debug --extra-params "-sdk iphonesimulator"
  #   # build-ios sets -destination generic/platform=iOS Simulator in Debug; do not use run-ios --simulator

jobs:
  ios-debug:
    name: iOS simulator debug (macOS required)
    runs-on: macos-latest
    if: ${{ vars.ENABLE_IOS_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: corepack enable
      - run: yarn install --immutable
      - name: CocoaPods
        working-directory: apps/mobile
        run: bundle install && bundle exec pod install --project-directory=ios
      - name: Build simulator (BUILD COMPATIBILITY only)
        working-directory: apps/mobile
        run: yarn react-native build-ios --mode Debug --extra-params "-sdk iphonesimulator"
      # RUNTIME ENCRYPTION / MIGRATION / PERSISTENCE require the __DEV__ spike UI on
      # a simulator or device — see docs/integrations/phase-1b-sqlcipher-spike.md.
