name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typescript:
    name: TypeScript lint, typecheck, tests, mobile Jest, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: corepack enable
      - run: corepack prepare yarn@4.10.3 --activate
      - run: yarn install --immutable
      - run: bash scripts/ci-verify-toolchain.sh
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:packages
      - run: yarn workspace @emi-coach/mobile test --watchAll=false
      - run: yarn boundaries
      - run: yarn sqlite-conflicts
      - run: yarn op-sqlite-config
      - run: yarn sqlcipher-spike-security

  privacy:
    name: Privacy forbidden-field scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: corepack prepare yarn@4.10.3 --activate
      - run: yarn install --immutable
      - run: yarn privacy-scan

  backend:
    name: Backend lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -e "./backend[dev]"
      - run: .venv/bin/ruff check app
        working-directory: backend
      - run: .venv/bin/mypy --config-file pyproject.toml app
        working-directory: backend
      - run: .venv/bin/pytest -q
        working-directory: backend
        env:
          PYTHONPATH: .

  android:
    name: Android debug assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: corepack enable
      - run: corepack prepare yarn@4.10.3 --activate
      - run: yarn install --immutable
      - run: bash scripts/ci-verify-toolchain.sh
        env:
          VERIFY_JDK: "true"
      - name: Install and verify Android SDK components
        run: bash scripts/ci-install-android-sdk.sh
      - name: Android build diagnostics
        working-directory: apps/mobile/android
        run: |
          java -version
          ./gradlew --version
          echo "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list | grep -E 'platforms;android-37|build-tools;37.0.0|ndk;27.1.12297006|platform-tools' || true
      # BUILD COMPATIBILITY only — proves native compile with SQLCipher linked.
      # Do not treat assembleDebug success as RUNTIME ENCRYPTION / MIGRATION / PERSISTENCE PASS.
      - name: Assemble debug
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Print Kotlin compiler errors from Gradle log
        if: failure()
        working-directory: apps/mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          secret_markers = (
              "password",
              "secret",
              "token",
              "authorization",
              "keystore",
              "api_key",
              "apikey",
          )
          needles = (
              "e: ",
              "error:",
              "FAILURE:",
              "What went wrong",
              "Execution failed for task",
              "CompilationErrorException",
              "compileDebugKotlin",
              "compileReleaseKotlin",
              "compileKotlin",
              "KotlinCompilation",
          )

          path = Path("gradle-build.log")
          if not path.exists():
              print("gradle-build.log is missing; cannot extract compiler errors")
              raise SystemExit(0)

          lines = path.read_text(errors="replace").splitlines()
          selected = []
          seen = set()
          for i, line in enumerate(lines):
              lower = line.lower()
              if any(marker in lower for marker in secret_markers):
                  continue
              if any(needle.lower() in lower for needle in needles):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 3)
                  for j in range(start, end):
                      if j not in seen:
                          selected.append(lines[j])
                          seen.add(j)

          print("--- Kotlin / Gradle compiler-error extract (max 100 lines) ---")
          if not selected:
              print("No compiler-error markers found in gradle-build.log")
              print("--- last 80 lines ---")
              for line in lines[-80:]:
                  lower = line.lower()
                  if any(marker in lower for marker in secret_markers):
                      continue
                  print(line)
          else:
              for line in selected[:100]:
                  print(line)
          print("--- end extract ---")
          PY
      - name: Upload Android Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-failure-log
          path: apps/mobile/android/gradle-build.log
          if-no-files-found: warn
